services:
  frontend:
    container_name: frontend
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Mapping port 3000 from container to host
    environment:
      - CHOKIDAR_USEPOLLING=true  # Required for file change detection in certain environments (Docker for Mac/Windows)
    volumes:
      - ./frontend/src:/app/src  # Bind mount the 'src' folder so changes are reflected
    command: npm run dev
    working_dir: /app # Ensures we're in the app directory

  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: usr_mgt
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
